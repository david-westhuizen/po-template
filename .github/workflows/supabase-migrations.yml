name: Apply Supabase migrations

# Applies any new supabase/migrations/*.sql to this repo's linked Supabase
# project when they land on main — so migrations ship on merge, no manual step.
#
# To enable in a repo cloned from this template:
#   1. Set project_id in supabase/config.toml to your project ref.
#   2. Add two repo secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#        SUPABASE_DB_PASSWORD   — Project Settings → Database
# Until both are in place this workflow no-ops (so the template itself is inert).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project ref
        id: ref
        run: |
          ref=$(grep -E '^\s*project_id\s*=' supabase/config.toml | head -1 | sed -E 's/.*=\s*"?([^"[:space:]]+)"?.*/\1/')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ -z "$ref" ] || [ "$ref" = "your-project-ref" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase migrations not configured (placeholder ref or missing secrets) — skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.ref.outputs.configured == 'true'
        with:
          version: latest

      - name: Link + apply pending migrations
        if: steps.ref.outputs.configured == 'true'
        run: |
          supabase link --project-ref "${{ steps.ref.outputs.ref }}"
          supabase db push
